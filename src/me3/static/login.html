<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · ME3</title>
<script>(function(){var t=localStorage.getItem('me3-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t;})();</script>
<style>
  :root, [data-theme="dark"] { --bg:#0c1016; --panel:#141a23; --line:#252d3c; --txt:#e8ebf1; --mute:#8d97aa; --acc:#6ea8ff; --bad:#ef6b73; --head:system-ui,sans-serif; }
  [data-theme="light"] { --bg:#f4f6f9; --panel:#ffffff; --line:#e1e5ec; --txt:#18202c; --mute:#5f6a7d; --acc:#2563eb; --bad:#d93a45; }
  [data-theme="royal"] { --bg:#110a22; --panel:#1b1235; --line:#4a3775; --txt:#f5eedd; --mute:#b3a5cc; --acc:#d9b44a; --bad:#f08a8f; --head:"Cormorant Garamond",Georgia,serif; }
  [data-theme="royal"] h1 { color:var(--acc); font-size:24px; }
  [data-theme="light"] a.g { border:1px solid #dadce0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui,sans-serif; }
  .card { width:min(400px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:36px 32px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.18); }
  h1 { margin:0 0 6px; font-size:20px; font-family:var(--head); } p { margin:0 0 26px; color:var(--mute); font-size:14px; }
  a.g { display:inline-flex; align-items:center; gap:12px; background:#fff; color:#1f1f1f; text-decoration:none; font-weight:500; padding:11px 20px; border-radius:8px; }
  a.g:hover { background:#f1f3f4; } a.g:focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  .err { display:none; margin:0 0 20px; padding:10px 12px; border:1px solid var(--bad); border-radius:8px; color:var(--bad); font-size:13px; }
  small { display:block; margin-top:24px; color:var(--mute); font-size:12px; }
</style></head>
<body><main class="card">
  <h1>ME3 File System Intelligence</h1>
  <p>Sign in to search and manage your files.</p>
  <div class="err" id="err" role="alert"></div>
  <a class="g" href="/auth/start">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Sign in with Google</a>
  <small>Your files stay on this machine. Google is used only to confirm who you are.</small>
</main>
<script>
  const e = new URLSearchParams(location.search).get('error');
  if (e) { const el = document.getElementById('err'); el.textContent = e; el.style.display = 'block'; }
</script></body></html>
